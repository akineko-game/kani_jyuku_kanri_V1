<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDS拡張コンポーネント — デモ</title>
<style>
  /* 既存ホームページのスタイルを模した外側レイアウト */
  body {
    margin: 0; padding: 0;
    background: #f5f5f5;
    font-family: sans-serif;
  }
  .site-header {
    background: #1a1a2e;
    color: #fff;
    padding: 12px 24px;
    font-size: 14px;
    letter-spacing: .05em;
  }
  .site-body {
    max-width: 900px;
    margin: 32px auto;
    padding: 0 16px;
  }
  .site-section-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 6px;
  }
  /* コンポーネントのマウント先 */
  #sds-component {
    margin-bottom: 40px;
  }
</style>
<!-- SDS専用CSS -->
<link rel="stylesheet" href="component.css">
</head>
<body>

<header class="site-header">既存ホームページ（デモ環境）</header>

<div class="site-body">
  <p class="site-section-title">▼ 以下のエリアがSDS拡張コンポーネントの埋め込み領域です</p>

  <!-- ↓ マウント先 -->
  <div id="sds-component"></div>

  <p style="font-size:12px;color:#999;text-align:center;margin-top:32px;">
    既存ページのその他のコンテンツはここに続きます
  </p>
</div>

<!-- SDS本体JS -->
<script src="component.js"></script>
<script>
  // 初期化
  SDS.initComponent({
    mountElement: '#sds-component',
    options: {}
  });

  // EventBus サンプル購読
  SDS.EventBus.on('teacher:稼働開始',   function(p){ console.log('[EventBus] 講師稼働開始', p); });
  SDS.EventBus.on('seat:予約枠確保',     function(p){ console.log('[EventBus] 座席確保',     p); });
  SDS.EventBus.on('notification:通知送信', function(p){ console.log('[EventBus] 通知送信',   p); });
</script>
</body>
</html>
