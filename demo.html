<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDS拡張コンポーネント v6 — 状態駆動UIデモ</title>
<style>
  body {
    margin: 0; padding: 0;
    background: #f0e8d8;
    font-family: sans-serif;
  }
  .site-header {
    background: #5a4530;
    color: #fdf8f0;
    padding: 12px 24px;
    font-size: 14px;
    letter-spacing: .05em;
  }
  .site-body {
    max-width: 960px;
    margin: 32px auto;
    padding: 0 16px;
  }
  .site-section-title {
    font-size: 13px;
    color: #9a8878;
    margin-bottom: 12px;
    border-bottom: 1px solid #ddd3c0;
    padding-bottom: 6px;
  }
  #sds-component { margin-bottom: 40px; }
</style>
<link rel="stylesheet" href="component.css">
</head>
<body>
<header class="site-header">既存ホームページ（SDS v6 デモ環境）</header>
<div class="site-body">
  <p class="site-section-title">▼ 以下のエリアが SDS 拡張コンポーネントの埋め込み領域です</p>
  <div id="sds-component"></div>
  <p style="font-size:12px;color:#999;text-align:center;margin-top:32px;">
    既存ページのその他のコンテンツはここに続きます
  </p>
</div>
<script src="component.js"></script>
<script>
  SDS.initComponent({ mountElement: '#sds-component' });

  // EventBus サンプル購読（外部連携の例）
  SDS.EventBus.on('store:teachers-updated', function(p) { console.log('[EventBus] 講師リスト更新', p); });
  SDS.EventBus.on('store:rooms-updated',    function(p) { console.log('[EventBus] 教室リスト更新', p); });
  SDS.EventBus.on('store:both-assigned',    function(p) { console.log('[EventBus] 講師+教室 揃い', p); });
  SDS.EventBus.on('store:seat-full',        function(p) { console.log('[EventBus] 満席', p); });
  SDS.EventBus.on('store:students-updated', function(p) { console.log('[EventBus] 生徒リスト更新', p); });
  SDS.EventBus.on('store:history-updated',  function(p) { console.log('[EventBus] 連絡履歴更新', p); });
</script>
</body>
</html>
